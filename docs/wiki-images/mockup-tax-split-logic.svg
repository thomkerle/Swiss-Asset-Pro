<svg viewBox="0 0 600 240" width="100%" xmlns="http://www.w3.org/2000/svg">
  <rect width="600" height="240" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="2"/>
  
  <rect x="0" y="0" width="600" height="40" rx="8" fill="#1e293b"/>
  <text x="20" y="25" font-family="sans-serif" font-size="13" font-weight="bold" fill="#f8fafc">System-Verbuchung: Dividenden Split</text>

  <!-- Gross Dividend Box -->
  <rect x="20" y="70" width="560" height="40" rx="6" fill="#334155"/>
  <circle cx="40" cy="90" r="12" fill="#475569"/>
  <text x="35" y="95" font-family="sans-serif" font-size="14" font-weight="bold" fill="#f8fafc">+</text>
  <text x="65" y="95" font-family="sans-serif" font-size="14" font-weight="bold" fill="#f8fafc">Brutto-Dividende (z.B. AAPL.US)</text>
  <text x="450" y="95" font-family="monospace" font-size="16" font-weight="bold" fill="#f8fafc" text-anchor="end">100.00 USD</text>

  <!-- Split Arrow -->
  <path d="M 65 110 L 65 140" fill="none" stroke="#475569" stroke-width="2"/>
  <path d="M 65 140 L 75 140" fill="none" stroke="#475569" stroke-width="2"/>
  
  <path d="M 65 110 L 65 190" fill="none" stroke="#475569" stroke-width="2"/>
  <path d="M 65 190 L 75 190" fill="none" stroke="#475569" stroke-width="2"/>

  <!-- Net Cashflow (Green) -->
  <rect x="85" y="120" width="495" height="40" rx="6" fill="#064e3b" stroke="#059669" stroke-width="1"/>
  <text x="105" y="145" font-family="sans-serif" font-size="13" font-weight="bold" fill="#34d399">Netto-Zufluss (auf Girokonto)</text>
  <rect x="310" y="128" width="80" height="24" rx="4" fill="#059669"/>
  <text x="325" y="145" font-family="sans-serif" font-size="11" font-weight="bold" fill="#ffffff">Cashflow</text>
  <text x="560" y="145" font-family="monospace" font-size="16" font-weight="bold" fill="#34d399" text-anchor="end">70.00 USD</text>

  <!-- Tax Reclaim (Yellow) -->
  <rect x="85" y="170" width="495" height="40" rx="6" fill="#713f12" stroke="#ca8a04" stroke-width="1"/>
  <text x="105" y="195" font-family="sans-serif" font-size="13" font-weight="bold" fill="#facc15">US-Quellensteuer (30%)</text>
  <rect x="270" y="178" width="140" height="24" rx="4" fill="#ca8a04"/>
  <text x="282" y="195" font-family="sans-serif" font-size="11" font-weight="bold" fill="#ffffff">Steuer-Schattenkonto</text>
  <text x="560" y="195" font-family="monospace" font-size="16" font-weight="bold" fill="#facc15" text-anchor="end">30.00 USD</text>
</svg>
