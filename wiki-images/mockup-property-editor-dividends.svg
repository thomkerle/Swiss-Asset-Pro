<svg viewBox="0 0 400 600" width="100%" xmlns="http://www.w3.org/2000/svg">
  <rect width="400" height="600" fill="#f8fafc"/>
  
  <!-- Basic Setup -->
  <text x="20" y="30" font-family="sans-serif" font-size="11" font-weight="bold" fill="#64748b" letter-spacing="0.5">WÄHRUNG</text>
  <rect x="20" y="40" width="120" height="40" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="35" y="66" font-family="sans-serif" font-size="15" fill="#1e293b">USD</text>
  <path d="M 115 56 L 125 56 L 120 62 Z" fill="#64748b"/>

  <text x="160" y="30" font-family="sans-serif" font-size="11" font-weight="bold" fill="#64748b" letter-spacing="0.5">AKTUELLER KURS</text>
  <rect x="160" y="40" width="180" height="40" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="175" y="66" font-family="sans-serif" font-size="15" fill="#1e293b">0.8920</text>
  <!-- Refresh Icon -->
  <path d="M 310 60 A 6 6 0 1 1 316 54 L 316 57 M 316 54 L 313 54" fill="none" stroke="#3b82f6" stroke-width="2" stroke-linecap="round"/>

  <!-- Liquid Funds Checkbox -->
  <rect x="20" y="100" width="320" height="46" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
  <rect x="35" y="115" width="16" height="16" rx="4" fill="#dc2626"/>
  <path d="M 38 123 L 42 127 L 48 119" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="65" y="128" font-family="sans-serif" font-size="15" font-weight="bold" fill="#1e293b">Liquides Mittel</text>

  <!-- Ticker & ISIN -->
  <text x="20" y="180" font-family="sans-serif" font-size="11" font-weight="bold" fill="#64748b" letter-spacing="0.5">TICKER (API)</text>
  <rect x="20" y="190" width="150" height="40" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="30" y="216" font-family="sans-serif" font-size="15" fill="#1e293b">KO.US</text>

  <text x="190" y="180" font-family="sans-serif" font-size="11" font-weight="bold" fill="#64748b" letter-spacing="0.5">ISIN</text>
  <rect x="190" y="190" width="150" height="40" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="200" y="216" font-family="sans-serif" font-size="13" fill="#94a3b8">US1912161007</text>

  <!-- Wertpapier Status Card (Yellow) -->
  <rect x="20" y="250" width="320" height="120" rx="12" fill="#fefce8" stroke="#fde047" stroke-width="2"/>
  <rect x="20" y="250" width="8" height="120" fill="#eab308" rx="4"/>
  <g transform="translate(45, 265)">
    <path d="M 0 15 L 0 20 L 20 20 L 20 5 L 15 5 L 15 15 Z" fill="#ca8a04"/>
    <path d="M 5 10 L 10 5 L 15 10 L 20 0" fill="none" stroke="#ca8a04" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="30" y="14" font-family="sans-serif" font-size="12" font-weight="bold" fill="#854d0e" letter-spacing="1">WERTPAPIER STATUS</text>
  </g>
  
  <text x="45" y="315" font-family="sans-serif" font-size="10" font-weight="bold" fill="#a16207" letter-spacing="0.5">AKTUELLE STÜCKZAHL</text>
  <rect x="45" y="325" width="120" height="36" rx="6" fill="#ffffff" stroke="#fef08a" stroke-width="1.5"/>
  <text x="55" y="348" font-family="monospace" font-size="15" font-weight="bold" fill="#1e293b">506</text>

  <text x="180" y="315" font-family="sans-serif" font-size="10" font-weight="bold" fill="#a16207" letter-spacing="0.5">AKTUELLER PREIS</text>
  <rect x="180" y="325" width="120" height="36" rx="6" fill="#ffffff" stroke="#fef08a" stroke-width="1.5"/>
  <text x="190" y="348" font-family="monospace" font-size="15" font-weight="bold" fill="#1e293b">85.65</text>

  <!-- Dividenden Prognose Card (Blue) -->
  <rect x="20" y="390" width="320" height="190" rx="12" fill="#eff6ff" stroke="#bfdbfe" stroke-width="2"/>
  <rect x="20" y="390" width="8" height="190" fill="#3b82f6" rx="4"/>

  <g transform="translate(45, 410)">
    <!-- Percent/Pie Icon -->
    <circle cx="8" cy="8" r="8" fill="none" stroke="#2563eb" stroke-width="2"/>
    <path d="M 8 8 L 8 0 A 8 8 0 0 1 16 8 Z" fill="#2563eb"/>
    <circle cx="5" cy="5" r="1.5" fill="#2563eb"/>
    <circle cx="11" cy="11" r="1.5" fill="#2563eb"/>
    <line x1="3" y1="13" x2="13" y2="3" stroke="#2563eb" stroke-width="1.5"/>
    <text x="30" y="13" font-family="sans-serif" font-size="12" font-weight="bold" fill="#1d4ed8" letter-spacing="1">DIVIDENDEN PROGNOSE</text>
  </g>

  <text x="45" y="455" font-family="sans-serif" font-size="9" font-weight="bold" fill="#1d4ed8" letter-spacing="0.5">ERW. RENDITE (%)</text>
  <rect x="45" y="465" width="120" height="36" rx="6" fill="#ffffff" stroke="#bae6fd" stroke-width="1.5"/>
  <text x="55" y="488" font-family="sans-serif" font-size="14" fill="#1e293b">2.48</text>

  <text x="180" y="455" font-family="sans-serif" font-size="9" font-weight="bold" fill="#1d4ed8" letter-spacing="0.5">STEUER-TOTAL (%)</text>
  <rect x="180" y="465" width="120" height="36" rx="6" fill="#ffffff" stroke="#bae6fd" stroke-width="1.5"/>
  <text x="190" y="488" font-family="sans-serif" font-size="14" fill="#1e293b">15</text>

  <text x="45" y="525" font-family="sans-serif" font-size="9" font-weight="bold" fill="#1d4ed8" letter-spacing="0.5">ZAHLMONATE (1-12)</text>
  <rect x="45" y="535" width="255" height="36" rx="6" fill="#ffffff" stroke="#bae6fd" stroke-width="1.5"/>
  <text x="55" y="558" font-family="sans-serif" font-size="14" fill="#1e293b">4, 7, 10, 12</text>

  <!-- Right Edge Tab -->
  <path d="M 360 200 L 400 200 L 400 450 L 360 450 Q 350 450 350 440 L 350 210 Q 350 200 360 200 Z" fill="#1e293b"/>
  <circle cx="375" cy="230" r="10" fill="#3b82f6"/>
  <text x="371" y="234" font-family="sans-serif" font-size="12" font-weight="bold" fill="#ffffff">3</text>
  <path d="M 375 248 L 370 258 L 375 258 L 373 268 L 382 254 L 376 254 Z" fill="#eab308"/>
  <text x="370" y="380" font-family="sans-serif" font-size="12" font-weight="bold" fill="#ffffff" letter-spacing="2" transform="rotate(-90 370 380)">SCHNELL-ZUGRIFF</text>
  <path d="M 380 410 L 370 420 L 380 430" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
